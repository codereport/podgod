<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POD GOD — Podcast Personalities</title>
  <meta name="description" content="The latest podcast appearances from 16 fascinating personalities, curated by POD GOD.">
  <meta property="og:title" content="POD GOD">
  <meta property="og:description" content="The latest podcast appearances from fascinating personalities.">
  <meta property="og:image" content="https://podgod.ca/social-preview.png">
  <meta property="og:image:width" content="2712">
  <meta property="og:image:height" content="1420">
  <meta property="og:image:alt" content="POD GOD — podcast personalities">
  <meta property="og:url" content="https://podgod.ca">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://podgod.ca/social-preview.png">
  <link rel="icon" type="image/png" href="/player-icon-borderless.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e17;
      --panel: rgba(20, 26, 40, 0.92);
      --panel-strong: #141a28;
      --line: rgba(255, 255, 255, 0.08);
      --line-hover: rgba(200, 80, 242, 0.34);
      --text: #f2f4f8;
      --muted: #94a3b8;
      --muted-dim: #64748b;
      --pink: #ff4d8d;
      --purple: #c850f2;
      --blue: #6c63ff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 8% -8%, rgba(255, 77, 141, 0.12), transparent 30rem),
        radial-gradient(circle at 92% 0%, rgba(108, 99, 255, 0.12), transparent 34rem),
        var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1560px, 100%);
      margin: 0 auto;
      padding: 34px 30px 54px;
    }

    .site-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: calc(100svh - 34px);
      margin-bottom: 0;
    }

    .hero-content {
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 22px;
      color: inherit;
      text-decoration: none;
    }

    .brand-icon {
      display: block;
      width: 108px;
      height: 108px;
      flex: 0 0 108px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(200, 80, 242, 0.18));
    }

    .brand-name {
      margin: 0;
      font-family: 'Bungee', 'Inter', sans-serif;
      font-size: 5.5rem;
      font-weight: 400;
      letter-spacing: 0.025em;
      line-height: 1;
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .editor-link {
      position: absolute;
      top: 0;
      right: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      text-underline-offset: 4px;
      transition: color 160ms ease;
    }

    .editor-link:hover,
    .editor-link:focus-visible {
      color: var(--text);
      text-decoration: underline;
    }

    .tagline {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1.25rem;
      font-weight: 500;
    }

    .scroll-cue {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted-dim);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .scroll-cue::after {
      content: '↓';
      display: block;
      margin-top: 5px;
      font-size: 1rem;
      text-align: center;
    }

    #personalities {
      scroll-margin-top: 24px;
    }

    .personality-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 320px));
      justify-content: center;
      gap: 22px;
    }

    .personality-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(27, 34, 51, 0.96), var(--panel));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .personality-card:hover {
      transform: translateY(-3px);
      border-color: var(--line-hover);
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.28);
    }

    .personality-art {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #171b28;
    }

    .personality-art::after {
      content: '';
      position: absolute;
      inset: auto 0 0;
      height: 38%;
      pointer-events: none;
      background: linear-gradient(transparent, rgba(11, 14, 23, 0.5));
    }

    .personality-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .personality-card:hover .personality-art img {
      transform: scale(1.018);
    }

    .personality-heading {
      min-width: 0;
      padding: 17px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .personality-heading h3 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.015em;
    }

    .personality-heading p {
      min-height: 1.3em;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .episode-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .episode-item + .episode-item {
      border-top: 1px solid var(--line);
    }

    .episode-link {
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr);
      align-items: center;
      gap: 13px;
      min-height: 96px;
      padding: 14px 15px;
      text-decoration: none;
      transition: background 150ms ease;
    }

    .episode-link:hover,
    .episode-link:focus-visible {
      outline: none;
      background: rgba(200, 80, 242, 0.07);
    }

    .episode-art {
      display: block;
      width: 66px;
      height: 66px;
      border-radius: 10px;
      background: #171b28;
      object-fit: cover;
    }

    .episode-body {
      min-width: 0;
    }

    .episode-title {
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.42;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .episode-podcast {
      margin-top: 7px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .episode-meta {
      margin-top: 5px;
      color: var(--muted-dim);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .empty-episodes {
      min-height: 192px;
      padding: 24px 15px;
      color: var(--muted-dim);
      font-size: 0.78rem;
    }

    .loading-card {
      min-height: 500px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-strong);
    }

    .loading-card::before {
      content: '';
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(100deg, #151b29 20%, #20283a 42%, #151b29 64%);
      background-size: 220% 100%;
      animation: shimmer 1.4s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: -220% 0; }
    }

    .load-error {
      grid-column: 1 / -1;
      padding: 50px 24px;
      border: 1px solid rgba(255, 77, 141, 0.22);
      border-radius: 18px;
      background: rgba(255, 77, 141, 0.05);
      text-align: center;
    }

    .load-error p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .retry-button {
      border: 1px solid var(--line-hover);
      border-radius: 999px;
      padding: 8px 16px;
      color: var(--text);
      background: rgba(200, 80, 242, 0.1);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .site-footer {
      padding-top: 34px;
      color: var(--muted-dim);
      font-size: 0.72rem;
      text-align: center;
    }

    @media (max-width: 1180px) {
      .personality-grid {
        grid-template-columns: repeat(3, minmax(0, 320px));
      }
    }

    @media (max-width: 820px) {
      .shell {
        padding: 26px 20px 44px;
      }

      .site-header {
        min-height: calc(100svh - 26px);
      }

      .brand-icon {
        width: 78px;
        height: 78px;
        flex-basis: 78px;
      }

      .brand-name {
        font-size: 4rem;
      }

      .personality-grid {
        grid-template-columns: repeat(2, minmax(0, 320px));
        gap: 16px;
      }
    }

    @media (max-width: 520px) {
      .shell {
        padding: 20px 14px 36px;
      }

      .site-header {
        min-height: calc(100svh - 20px);
      }

      .brand {
        gap: 12px;
      }

      .brand-icon {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
      }

      .brand-name {
        font-size: 2.9rem;
      }

      .editor-link {
        top: 0;
      }

      .tagline {
        max-width: 300px;
        margin: 16px auto 0;
        font-size: 1rem;
        line-height: 1.5;
      }

      .personality-grid {
        grid-template-columns: 1fr;
      }

      .loading-card {
        min-height: 500px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="hero-content">
        <a class="brand" href="/" aria-label="POD GOD home">
          <img class="brand-icon" src="/player-icon-borderless.png" alt="" width="108" height="108">
          <h1 class="brand-name">POD GOD</h1>
        </a>
        <p class="tagline">The best podcast player and editor out there.</p>
      </div>
      <a class="editor-link" href="/editor/">Editor</a>
      <a class="scroll-cue" href="#personalities">Personalities</a>
    </header>

    <main id="personalities" aria-label="Podcast personalities">
      <div class="personality-grid" id="personality-grid" aria-live="polite" aria-busy="true">
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
        <div class="loading-card" aria-hidden="true"></div>
      </div>

      <noscript>
        <p class="load-error">JavaScript is required to load the latest podcast episodes.</p>
      </noscript>
    </main>

    <footer class="site-footer">Curated daily by POD GOD.</footer>
  </div>

  <script>
    const grid = document.getElementById('personality-grid');
    const dateFormatter = new Intl.DateTimeFormat('en-CA', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
    });

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : dateFormatter.format(date);
    }

    function formatDuration(value) {
      const seconds = Number(value);
      if (!Number.isFinite(seconds) || seconds <= 0) return '';
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (hours && minutes) return `${hours}h ${minutes}m`;
      if (hours) return `${hours}h`;
      return `${minutes}m`;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { headers: { accept: 'application/json' } });
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    function episodeItem(episode) {
      const item = element('li', 'episode-item');
      const destination = episode.episode_url || episode.audio_url;
      const link = element(destination ? 'a' : 'div', 'episode-link');
      if (destination) {
        link.href = destination;
        link.target = '_blank';
        link.rel = 'noreferrer';
      }

      const artwork = document.createElement('img');
      artwork.className = 'episode-art';
      artwork.src = episode.artwork_url || episode.podcast_artwork_url || '/player-icon-borderless.png';
      artwork.alt = '';
      artwork.width = 66;
      artwork.height = 66;
      artwork.loading = 'lazy';
      artwork.decoding = 'async';
      artwork.addEventListener('error', () => {
        artwork.src = '/player-icon-borderless.png';
      }, { once: true });

      const body = element('div', 'episode-body');
      body.append(element('span', 'episode-title', episode.title || 'Untitled episode'));
      body.append(element('div', 'episode-podcast', episode.podcast_title || 'Podcast'));

      const metadata = [formatDate(episode.pub_date), formatDuration(episode.duration)].filter(Boolean);
      if (metadata.length) body.append(element('div', 'episode-meta', metadata.join(' · ')));

      link.append(artwork, body);
      item.append(link);
      return item;
    }

    function personalityCard(personality, feed, index) {
      const card = element('article', 'personality-card');

      const art = element('div', 'personality-art');
      const image = document.createElement('img');
      image.src = personality.artwork_url || feed.artwork_url || '/player-icon-borderless.png';
      image.alt = personality.name;
      image.width = 600;
      image.height = 600;
      image.loading = index < 4 ? 'eager' : 'lazy';
      image.decoding = 'async';
      image.addEventListener('error', () => {
        image.src = '/player-icon-borderless.png';
      }, { once: true });
      art.append(image);

      const heading = element('header', 'personality-heading');
      heading.append(element('h3', '', personality.name));
      heading.append(element('p', '', personality.title || feed.title || 'Podcast appearances'));

      const list = element('ol', 'episode-list');
      const episodes = [...(feed.episodes || [])]
        .filter((episode) => /^en(?:[-_]|$)/i.test(String(episode.language || '').trim()))
        .sort((left, right) => new Date(right.pub_date || 0) - new Date(left.pub_date || 0))
        .slice(0, 2);

      if (episodes.length) {
        episodes.forEach((episode) => list.append(episodeItem(episode)));
      } else {
        const empty = element('li', 'empty-episodes', 'No recent English episodes yet.');
        list.append(empty);
      }

      card.append(art, heading, list);
      return card;
    }

    async function loadPersonalities() {
      grid.setAttribute('aria-busy', 'true');
      try {
        const index = await fetchJson('/data/v1/personalities.json');
        const personalities = index.personalities || [];
        const feeds = await Promise.all(personalities.map(async (personality) => {
          try {
            return await fetchJson(personality.feed_url);
          } catch (error) {
            console.error(`Could not load ${personality.name}`, error);
            return { episodes: [] };
          }
        }));

        grid.replaceChildren(...personalities.map((personality, position) =>
          personalityCard(personality, feeds[position], position)
        ));
      } catch (error) {
        console.error('Could not load POD GOD personalities', error);
        const message = element('div', 'load-error');
        message.append(element('p', '', 'The latest personality feeds could not be loaded.'));
        const retry = element('button', 'retry-button', 'Try again');
        retry.type = 'button';
        retry.addEventListener('click', loadPersonalities);
        message.append(retry);
        grid.replaceChildren(message);
      } finally {
        grid.setAttribute('aria-busy', 'false');
      }
    }

    loadPersonalities();
  </script>
</body>
</html>
