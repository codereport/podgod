name: Extend Personality History

run-name: Extend personality history · ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Private history-job identifier"
        required: true
        type: string
      personality_id:
        description: "Personality id to backfill"
        required: true
        type: string
      since:
        description: "Total history window to search, such as 730d"
        required: true
        type: string

concurrency:
  # All personality refreshes update the same public index/feed files.
  group: refresh-personalities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load private network reporter
        env:
          ACTIVITY_TOKEN: ${{ secrets.PODGOD_PERSONALITY_CREATION_TOKEN }}
        run: |
          if [ -n "$ACTIVITY_TOKEN" ] && curl --fail --silent --show-error --retry 1 --max-time 10 \
            -H "Authorization: Bearer $ACTIVITY_TOKEN" \
            https://api.podgod.ca/internal/network-reporter.py \
            --output "$RUNNER_TEMP/podgod_network_activity.py"; then
            echo "PYTHONPATH=$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          else
            rm -f "$RUNNER_TEMP/podgod_network_activity.py"
            echo "::warning::Network reporting is unavailable; continuing the job."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-refresh.txt

      - name: Validate request
        env:
          PERSONALITY_ID: ${{ inputs.personality_id }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          [[ "$PERSONALITY_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$SINCE" =~ ^[1-9][0-9]*d$ ]]

      - name: Install discovery dependencies
        run: pip install -r scripts/requirements-refresh.txt

      - name: Search the extended history
        env:
          PODGOD_ACTIVITY_URL: https://api.podgod.ca/internal/network-events
          PODGOD_ACTIVITY_TOKEN: ${{ secrets.PODGOD_PERSONALITY_CREATION_TOKEN }}
          PODGOD_ACTIVITY_JOB_ID: ${{ inputs.job_id }}
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          PERSONALITY_ID: ${{ inputs.personality_id }}
          SINCE: ${{ inputs.since }}
        run: python scripts/refresh_personalities.py --since "$SINCE" --only "$PERSONALITY_ID"

      - name: Commit extended feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(personalities): extend ${{ inputs.personality_id }} history"
          file_pattern: "data/v1/personalities.json data/v1/personalities/*.json"
          commit_user_name: "podgod-bot"
          commit_user_email: "bot@podgod.ca"
