name: Refresh Personalities
run-name: ${{ inputs.daily_run_date && format('Daily discovery · {0}', inputs.daily_run_date) || 'Refresh Personalities' }}

on:
  workflow_dispatch:
    inputs:
      daily_run_date:
        description: "Daily publication date supplied by the Cloudflare coordinator (YYYY-MM-DD). Leave blank for a manual refresh."
        required: false
        default: ""
      since:
        description: "Time window to scan (e.g. 24h for the daily run, 365d for a backfill)."
        required: false
        default: "24h"
      only:
        description: "Optional personality id to limit to (e.g. jensen-huang). Blank = all."
        required: false
        default: ""

concurrency:
  group: refresh-personalities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load private network reporter
        env:
          ACTIVITY_TOKEN: ${{ secrets.PODGOD_PERSONALITY_CREATION_TOKEN }}
        run: |
          if [ -n "$ACTIVITY_TOKEN" ] && curl --fail --silent --show-error --retry 1 --max-time 10 \
            -H "Authorization: Bearer $ACTIVITY_TOKEN" \
            https://api.podgod.ca/internal/network-reporter.py \
            --output "$RUNNER_TEMP/podgod_network_activity.py"; then
            echo "PYTHONPATH=$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          else
            rm -f "$RUNNER_TEMP/podgod_network_activity.py"
            echo "::warning::Network reporting is unavailable; continuing the job."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-refresh.txt

      - name: Refresh personality feeds
        env:
          PODGOD_ACTIVITY_URL: https://api.podgod.ca/internal/network-events
          PODGOD_ACTIVITY_TOKEN: ${{ secrets.PODGOD_PERSONALITY_CREATION_TOKEN }}
          PODGOD_ACTIVITY_JOB_ID: ${{ inputs.daily_run_date }}
          # Optional: if these secrets are set, discovery uses PodcastIndex
          # byperson (better matches). If absent, it falls back to the iTunes
          # Search API automatically - no signup/key required.
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          # Cloudflare dispatches the daily run; manual dispatch can override.
          SINCE: ${{ github.event.inputs.since || '24h' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: |
          if [ -n "$ONLY" ]; then
            python scripts/refresh_personalities.py --since "$SINCE" --only "$ONLY"
          else
            python scripts/refresh_personalities.py --since "$SINCE"
          fi

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(personalities): refresh meta-podcast feeds"
          file_pattern: "data/v1/personalities.json data/v1/personalities/*.json"
          commit_user_name: "podgod-bot"
          commit_user_email: "bot@podgod.ca"
