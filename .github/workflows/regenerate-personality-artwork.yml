name: Regenerate Personality Artwork

run-name: Regenerate artwork · ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Private artwork-job identifier"
        required: true
        type: string

concurrency:
  # Share the public-data lock with creation and scheduled refreshes.
  group: refresh-personalities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-art.txt

      - name: Fetch private artwork input
        env:
          JOB_ID: ${{ inputs.job_id }}
          CREATION_TOKEN: ${{ secrets.PODGOD_PERSONALITY_CREATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CREATION_TOKEN"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CREATION_TOKEN" \
            "https://api.podgod.ca/internal/personality-artwork-jobs/$JOB_ID" \
            --output "$RUNNER_TEMP/personality.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CREATION_TOKEN" \
            "https://api.podgod.ca/internal/personality-artwork-jobs/$JOB_ID/photo" \
            --output "$RUNNER_TEMP/personality-photo"
          personality_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/personality.json")"
          echo "PERSONALITY_ID=$personality_id" >> "$GITHUB_ENV"

      - name: Install artwork dependencies
        run: pip install -r scripts/requirements-art.txt

      - name: Generate branded artwork
        run: >-
          python scripts/make_personality_art.py
          --only "$PERSONALITY_ID"
          --photo "$RUNNER_TEMP/personality-photo"
          --model u2net_human_seg
          --jobs 1

      - name: Commit the regenerated artwork
        run: |
          set -euo pipefail
          git config user.name podgod-bot
          git config user.email bot@podgod.ca
          git add -- \
            scripts/art-credits.json \
            data/v1/personalities.json \
            "data/v1/personalities/$PERSONALITY_ID.json" \
            "data/v1/personalities/art/$PERSONALITY_ID.png"
          git diff --cached --quiet && {
            echo "Artwork regeneration produced no committable changes" >&2
            exit 1
          }
          git commit -m "feat(personalities): regenerate $PERSONALITY_ID artwork"
          git push
