<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POD GOD Editor</title>
  <meta name="description" content="POD GOD Editor.">
  <meta property="og:title" content="POD GOD Editor">
  <meta property="og:description" content="POD GOD Editor.">
  <meta property="og:image" content="https://podgod.ca/social-preview.png">
  <meta property="og:url" content="https://podgod.ca/editor/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/player-icon-borderless.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e17;
      --panel: rgba(20, 26, 40, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f2f4f8;
      --muted: #94a3b8;
      --pink: #ff4d8d;
      --purple: #c850f2;
      --blue: #6c63ff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(255, 77, 141, 0.12), transparent 30rem),
        radial-gradient(circle at 85% 0%, rgba(108, 99, 255, 0.13), transparent 34rem),
        var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 34px 30px 60px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 54px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .brand span {
      font-family: 'Bungee', 'Inter', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.025em;
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-link {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-underline-offset: 4px;
      text-decoration: none;
    }

    .home-link:hover,
    .home-link:focus-visible {
      color: var(--text);
      text-decoration: underline;
    }

    main {
      text-align: center;
    }

    .editor-card {
      overflow: hidden;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.34);
    }

    .editor-card img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 8px 5px;
      text-align: left;
    }

    .card-footer h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .card-footer p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .coming-soon {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 15px;
      color: var(--bg);
      background: linear-gradient(135deg, var(--pink), var(--purple));
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .shell {
        padding: 22px 14px 38px;
      }

      .site-header {
        margin-bottom: 42px;
      }

      .brand img {
        width: 44px;
        height: 44px;
      }

      .brand span {
        font-size: 1.6rem;
      }

      .editor-card {
        padding: 9px;
      }

      .card-footer {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 5px 5px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="POD GOD home">
        <img src="/player-icon-borderless.png" alt="" width="54" height="54">
        <span>POD GOD</span>
      </a>
      <a class="home-link" href="/">Home</a>
    </header>

    <main>
      <section class="editor-card" aria-labelledby="editor-card-title">
        <img src="/img.png" alt="POD GOD Editor podcast editing interface" width="1024" height="530">
        <div class="card-footer">
          <div>
            <h2 id="editor-card-title">POD GOD Editor</h2>
            <p>A fast, focused editor built for spoken audio.</p>
          </div>
          <span class="coming-soon">Coming soon</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
